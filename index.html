<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hausdorff Space | Topology of Thought</title>
    <meta name="description" content="Hausdorff Space is a Nairobi intellectual collective — decomposing research papers, patents, and big ideas for the public. Mathematics, philosophy, science." />

    <!-- OpenGraph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hausdorff Space | Topology of Thought" />
    <meta property="og:description" content="A Nairobi intellectual collective where any two distinct ideas can be separated. We decompose Nature papers, WIPO patents, and big ideas — for everyone." />
    <meta property="og:url" content="https://hausdorff-space.vercel.app" />
    <meta property="og:site_name" content="Hausdorff Space" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hausdorff Space | Topology of Thought" />
    <meta name="twitter:description" content="A Nairobi intellectual collective where any two distinct ideas can be separated. Mathematics · Philosophy · Science." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'haus-black': '#0a0a0a',
              'haus-gray': '#1a1a1a',
              'haus-text': '#e5e5e5',
              'haus-accent': '#6366f1', // Indigo 500
              'paper-white': '#fdfbf7',
            },
            fontFamily: {
              serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
              mono: ['"Courier New"', 'Courier', 'monospace'],
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for a sleek look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* Entrance Animation Utility */
      .reveal-hidden {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Floating ambient symbol animation */
      @keyframes floatSymbol {
        0%   { transform: translateY(0px) rotate(0deg); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translateY(-30px) rotate(8deg); }
        90%  { opacity: 1; }
        100% { transform: translateY(-60px) rotate(-4deg); opacity: 0; }
      }
      .animate-float-symbol {
        animation: floatSymbol linear infinite;
      }

      /* Subtle grid texture overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(99,102,241,0.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99,102,241,0.015) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        z-index: -1;
      }

      /* Thin accent line on section hover */
      .section-line {
        position: relative;
      }
      .section-line::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0;
        width: 0; height: 1px;
        background: #6366f1;
        transition: width 0.4s ease;
      }
      .section-line:hover::after {
        width: 100%;
      }
    </style>
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script type="importmap">
{
  "imports": {

    "react/": "https://esm.sh/react@19.2.4/"
  }
}
</script>
  </head>

  </body>
</html>
